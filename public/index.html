<html>
  <head>
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta content="IE=11.0000" http-equiv="X-UA-Compatible" />
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <meta name="navico-store" content="mfd-insight-store" />
    <title>VHFinfo</title>
    <script type="text/javascript" src="js/jquery.min.js"></script>
    <script>
      document.write(
        '<script type="text/javascript" src="mfd.js?ver=' +
          Math.floor(Math.random() * 1000) +
          '"><\/script>',
      );
    </script>
    <script>
      try {
        document.documentElement.className = vhfMfd.useNearbyLayout()
          ? "layout-nearby"
          : "layout-mfd";
      } catch (err) {
        document.documentElement.className = "layout-mfd";
      }
    </script>
    <script>
      document.write(
        '<link rel="stylesheet" href="style.css?ver=' +
          Math.floor(Math.random() * 1000) +
          '">',
      );
    </script>
  </head>
  <body>
    <div class="header">
      <a
        href="https://vhfinfo.org/"
        style="color: #ffffff; text-decoration: none"
        >VHFinfo.org</a
      >
    </div>
    <div class="list" id="list"></div>
  </body>
</html>
<script>
  var connected = false;
  var ws;
  var wsNr = 0;
  var reconnectTimer;
  var options = {};
  var catalog = {};
  var shownCount = 0;
  var lastCompact = null;
  var lastNearby = null;
  var NEARBY_URL = "/signalk/v1/api/vhfinfo/nearby";
  var OPTIONS_URL = "/signalk/v1/api/vhfinfo/options";
  var COMPACT_PATH = "vhfinfo.nearby";

  function rememberCatalog(list) {
    catalog = vhfMfd.assign(catalog, vhfMfd.catalogFromList(list));
  }

  function applyRecords(records) {
    var listEl = document.getElementById("list");
    var slots = vhfMfd.slotsForDisplay(records, vhfMfd.MAX_RESULTS);
    var i;
    if (slots.length === 0) {
      listEl.innerHTML = "No VHF stations nearby";
      shownCount = 0;
      return;
    }
    if (!document.getElementById("entry_0")) {
      listEl.innerHTML = "";
      shownCount = 0;
    }
    for (i = 0; i < slots.length; i++) {
      if (document.getElementById("entry_" + i) == null) {
        createEntry(i);
      }
      updateEntry(i, slots[i]);
    }
    for (i = slots.length; i < shownCount; i++) {
      var node = document.getElementById("entry_" + i);
      if (node) {
        node.remove();
      }
    }
    shownCount = slots.length;
  }

  function fetchNearby() {
    $.getJSON(NEARBY_URL)
      .done(function (list) {
        if (!Array.isArray(list)) {
          return;
        }
        lastNearby = list;
        rememberCatalog(list);
        applyRecords(rankedRecords());
      })
      .fail(function () {
        if (shownCount === 0) {
          document.getElementById("list").innerHTML =
            "Waiting for VHFinfo nearby…";
        }
      });
  }

  function compactById(hits) {
    var map = {};
    (hits || []).forEach(function (hit) {
      if (hit && hit.id != null && hit.id !== "") {
        map[String(hit.id)] = hit;
      }
    });
    return map;
  }

  function rankedRecords() {
    if (lastNearby && lastNearby.length) {
      var live = compactById(lastCompact);
      return lastNearby.map(function (item) {
        var hit = item && item.id != null ? live[String(item.id)] : null;
        return hit ? vhfMfd.mergeHit(hit, catalog) : item;
      });
    }
    return vhfMfd.mergeHits(lastCompact, catalog);
  }

  function applyCompact(hits) {
    lastCompact = hits;
    if (vhfMfd.needsCatalog(hits, catalog)) {
      fetchNearby();
    }
    applyRecords(rankedRecords());
  }

  function readOptions() {
    $.getJSON(OPTIONS_URL)
      .done(function (json) {
        options = json || {};
      })
      .always(function () {
        fetchNearby();
        connect();
      });
  }

  function handlePathValue(path, value) {
    if (path === COMPACT_PATH) {
      applyCompact(Array.isArray(value) ? value : []);
      return;
    }
  }

  function handleData(data) {
    var updates = (data && data.updates) || [];
    for (var u = 0; u < updates.length; u++) {
      var values = (updates[u] && updates[u].values) || [];
      for (var i = 0; i < values.length; i++) {
        handlePathValue(values[i].path, values[i].value);
      }
    }
  }

  function connect() {
    if (connected || wsNr >= 1) {
      return;
    }
    ws = new WebSocket(
      (window.location.protocol === "https:" ? "wss" : "ws") +
        "://" +
        window.location.host +
        "/signalk/v1/stream?subscribe=none",
    );
    ws.onopen = function () {
      wsNr++;
      connected = true;
      var subscriptionMessage = JSON.stringify({
        context: "vessels.self",
        subscribe: [{ path: COMPACT_PATH }],
      });
      console.log("subscriptionMessage: " + subscriptionMessage);
      ws.send(subscriptionMessage);
      fetchNearby();
    };
    ws.onmessage = function (event) {
      if (String(event.data).indexOf("signalk-server") !== -1) {
        return;
      }
      try {
        handleData(JSON.parse(event.data));
      } catch (e) {
        console.log(e);
      }
    };
    ws.onclose = function () {
      connected = false;
      wsNr = Math.max(0, wsNr - 1);
      clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(connect, 1000);
    };
    ws.onerror = function (err) {
      console.log(
        "WebSocket connection error: " + err.message + " - closing connection",
      );
      ws.close();
    };
  }

  function updateEntry(id, record) {
    if (!record) {
      return;
    }
    var nameEl = document.getElementById("name_" + id);
    var channelEl = document.getElementById("channel_" + id);
    var typeEl = document.getElementById("type_" + id);
    var urlEl = document.getElementById("url_" + id);
    var phoneEl = document.getElementById("phone_" + id);
    var noteEl = document.getElementById("note_" + id);
    var notes = document.getElementById("notes_" + id);
    if (nameEl) {
      nameEl.innerHTML = vhfMfd.escapeHtml(vhfMfd.displayName(record));
    }
    if (channelEl) {
      var channel = vhfMfd.channelText(record);
      channelEl.innerHTML = vhfMfd.escapeHtml(channel);
      if (vhfMfd.useNearbyLayout()) {
        channelEl.style.fontSize =
          vhfMfd.channelFontSizeEm(channel, 0.68) + "em";
      } else {
        channelEl.style.fontSize = "";
      }
    }
    if (typeEl) {
      typeEl.innerHTML = vhfMfd.useNearbyLayout()
        ? vhfMfd.typeLineHtml(record)
        : vhfMfd.escapeHtml(vhfMfd.typeLine(record));
    }
    if (urlEl) {
      urlEl.innerHTML = vhfMfd.urlIconHtml(vhfMfd.pickBlockUrl(record));
    }
    if (phoneEl) {
      phoneEl.innerHTML = vhfMfd.phoneIconHtml(vhfMfd.pickBlockPhone(record));
    }
    var note = vhfMfd.pickBlockNote(record);
    if (noteEl) {
      noteEl.innerHTML = note ? vhfMfd.escapeHtml(String(note)) : "";
    }
    if (notes) {
      notes.style.display = note ? "" : "none";
    }
  }

  function createNearbyEntry(id) {
    var wrap = document.createElement("article");
    wrap.className = "vhf-info-block nearby";
    wrap.id = "entry_" + id;
    wrap.innerHTML =
      '<div class="channel" id="channel_' +
      id +
      '"></div>' +
      '<div class="type" id="type_' +
      id +
      '"></div>' +
      '<h2 class="name" id="name_' +
      id +
      '"></h2>' +
      '<div class="note" id="note_' +
      id +
      '"></div>' +
      '<div class="phone" id="phone_' +
      id +
      '"></div>' +
      '<div class="url" id="url_' +
      id +
      '"></div>';
    document.getElementById("list").appendChild(wrap);
  }

  function createMfdEntry(id) {
    var entry = document.createElement("div");
    var channelblock = document.createElement("div");
    var channel = document.createElement("div");
    var typeblock = document.createElement("div");
    var type = document.createElement("div");
    var phone = document.createElement("div");
    var url = document.createElement("div");
    var name = document.createElement("div");
    var notes = document.createElement("div");
    var note = document.createElement("div");
    entry.className = "entry";
    entry.id = "entry_" + id;
    channelblock.className = "channelblock";
    channel.className = "channel";
    channel.id = "channel_" + id;
    channelblock.appendChild(channel);
    typeblock.className = "typeblock";
    type.className = "type";
    type.id = "type_" + id;
    typeblock.appendChild(type);
    phone.className = "phone";
    phone.id = "phone_" + id;
    typeblock.appendChild(phone);
    url.className = "url";
    url.id = "url_" + id;
    typeblock.appendChild(url);
    channelblock.appendChild(typeblock);
    entry.appendChild(channelblock);
    name.className = "name";
    name.id = "name_" + id;
    entry.appendChild(name);
    notes.className = "notes";
    notes.id = "notes_" + id;
    entry.appendChild(notes);
    note.className = "note";
    note.id = "note_" + id;
    notes.appendChild(note);
    document.getElementById("list").appendChild(entry);
  }

  function createEntry(id) {
    if (vhfMfd.useNearbyLayout()) {
      createNearbyEntry(id);
      return;
    }
    createMfdEntry(id);
  }

  readOptions();
  setInterval(function () {
    fetchNearby();
  }, 5000);
</script>
