<html>
  <head>
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta content="IE=11.0000" http-equiv="X-UA-Compatible" />
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <meta name="navico-store" content="mfd-insight-store" />
    <title>VHFinfo</title>
    <script type="text/javascript" src="js/jquery.min.js"></script>
    <script type="text/javascript" src="mfd.js"></script>
    <script>
      document.write(
        '<link rel="stylesheet" href="style.css?ver=' +
          Math.floor(Math.random() * 1000) +
          '">',
      );
    </script>
  </head>
  <body>
    <div class="header">
      <a
        href="https://vhfinfo.org/"
        style="color: #ffffff; text-decoration: none"
        >VHFinfo.org</a
      >
    </div>
    <div class="list" id="list"></div>
  </body>
</html>
<script>
  var connected = false;
  var ws;
  var wsNr = 0;
  var reconnectTimer;
  var options = {};
  var catalog = {};
  var shownCount = 0;
  var lastCompact = null;
  var NEARBY_URL = "/signalk/v1/api/vhfinfo/nearby";
  var OPTIONS_URL = "/signalk/v1/api/vhfinfo/options";
  var COMPACT_PATH = "vhfinfo.nearby";

  function pathNr() {
    return options.pathNr || 5;
  }

  function rememberCatalog(list) {
    catalog = Object.assign(catalog, vhfMfd.catalogFromList(list));
  }

  function applyRecords(records) {
    var listEl = document.getElementById("list");
    var slots = vhfMfd.slotsForDisplay(records, pathNr());
    var i;
    if (slots.length === 0) {
      listEl.innerHTML = "No VHF stations nearby";
      shownCount = 0;
      return;
    }
    if (!document.getElementById("entry_0")) {
      listEl.innerHTML = "";
      shownCount = 0;
    }
    for (i = 0; i < slots.length; i++) {
      if (document.getElementById("entry_" + i) == null) {
        createEntry(i);
      }
      updateEntry(i, slots[i]);
    }
    for (i = slots.length; i < shownCount; i++) {
      var node = document.getElementById("entry_" + i);
      if (node) {
        node.remove();
      }
    }
    shownCount = slots.length;
  }

  function fetchNearby(thenApply) {
    $.getJSON(NEARBY_URL)
      .done(function (list) {
        if (!Array.isArray(list)) {
          return;
        }
        rememberCatalog(list);
        if (lastCompact) {
          applyRecords(vhfMfd.mergeHits(lastCompact, catalog));
        } else if (thenApply !== false) {
          applyRecords(list);
        }
      })
      .fail(function () {
        if (shownCount === 0) {
          document.getElementById("list").innerHTML =
            "Waiting for VHFinfo nearby…";
        }
      });
  }

  function applyCompact(hits) {
    lastCompact = hits;
    if (vhfMfd.needsCatalog(hits, catalog)) {
      fetchNearby(false);
    }
    applyRecords(vhfMfd.mergeHits(hits, catalog));
  }

  function readOptions() {
    $.getJSON(OPTIONS_URL)
      .done(function (json) {
        options = json || {};
      })
      .always(function () {
        fetchNearby(true);
        connect();
      });
  }

  function handlePathValue(path, value) {
    if (path === COMPACT_PATH) {
      applyCompact(Array.isArray(value) ? value : []);
      return;
    }
  }

  function handleData(data) {
    var updates = (data && data.updates) || [];
    for (var u = 0; u < updates.length; u++) {
      var values = (updates[u] && updates[u].values) || [];
      for (var i = 0; i < values.length; i++) {
        handlePathValue(values[i].path, values[i].value);
      }
    }
  }

  function connect() {
    if (connected || wsNr >= 1) {
      return;
    }
    ws = new WebSocket(
      (window.location.protocol === "https:" ? "wss" : "ws") +
        "://" +
        window.location.host +
        "/signalk/v1/stream?subscribe=none",
    );
    ws.onopen = function () {
      wsNr++;
      connected = true;
      var subscriptionMessage = JSON.stringify({
        context: "vessels.self",
        subscribe: [{ path: COMPACT_PATH }],
      });
      console.log("subscriptionMessage: " + subscriptionMessage);
      ws.send(subscriptionMessage);
      fetchNearby(true);
    };
    ws.onmessage = function (event) {
      if (String(event.data).indexOf("signalk-server") !== -1) {
        return;
      }
      try {
        handleData(JSON.parse(event.data));
      } catch (e) {
        console.log(e);
      }
    };
    ws.onclose = function () {
      connected = false;
      wsNr = Math.max(0, wsNr - 1);
      clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(connect, 1000);
    };
    ws.onerror = function (err) {
      console.log(
        "WebSocket connection error: " + err.message + " - closing connection",
      );
      ws.close();
    };
  }

  function updateEntry(id, record) {
    if (!record) {
      return;
    }
    var nameEl = document.getElementById("name_" + id);
    var callEl = document.getElementById("callname_" + id);
    var channelEl = document.getElementById("channel_" + id);
    var typeEl = document.getElementById("type_" + id);
    var modeEl = document.getElementById("mode_" + id);
    var distanceEl = document.getElementById("distance_" + id);
    var urlEl = document.getElementById("url_" + id);
    var phoneEl = document.getElementById("phone_" + id);
    if (nameEl) {
      nameEl.innerHTML = record.name ? "Name: " + record.name : "";
    }
    if (callEl) {
      callEl.innerHTML = record.callname ? "Callsign: " + record.callname : "";
    }
    if (channelEl) {
      channelEl.innerHTML = record.channel || "";
    }
    if (typeEl) {
      typeEl.innerHTML = String(record.type || "").toUpperCase();
    }
    if (modeEl) {
      modeEl.innerHTML = vhfMfd.displayMode(record);
    }
    if (distanceEl) {
      var distance = record.distance;
      distanceEl.innerHTML =
        distance == null || distance === "" ? "" : distance + "m";
    }
    if (urlEl) {
      urlEl.innerHTML = record.url
        ? '<a href="' +
          record.url +
          '" style="text-decoration:none; color: white">&#128279;</a>'
        : "";
    }
    if (phoneEl) {
      phoneEl.innerHTML = record.phone
        ? '<a href="tel:' +
          record.phone +
          '" style="text-decoration:none; color: white">&#9990;</a>'
        : "";
    }
    var note = false;
    var sub_types = ["generic", "pleasure", "cargo"];
    sub_types.forEach(function (sub_type) {
      var el = document.getElementById(sub_type + "_note_" + id);
      if (!el) {
        return;
      }
      if (
        record.vhfdata &&
        record.vhfdata[sub_type] &&
        record.vhfdata[sub_type].note
      ) {
        el.innerHTML =
          sub_type.toUpperCase() + ": " + record.vhfdata[sub_type].note;
        note = true;
      } else {
        el.innerHTML = "";
      }
    });
    var notes = document.getElementById("notes_" + id);
    if (notes) {
      notes.style.display = note ? "" : "none";
    }
  }

  function createEntry(id) {
    const entry = document.createElement("div");
    entry.classList.add("entry");
    entry.id = "entry_" + id;

    const channelblock = document.createElement("div");
    channelblock.classList.add("channelblock");

    const channel = document.createElement("div");
    channel.classList.add("channel");
    channel.id = "channel_" + id;
    channelblock.appendChild(channel);

    const typeblock = document.createElement("div");
    typeblock.classList.add("typeblock");
    const type = document.createElement("div");
    type.classList.add("type");
    type.id = "type_" + id;
    typeblock.appendChild(type);
    const mode = document.createElement("div");
    mode.classList.add("mode");
    mode.id = "mode_" + id;
    typeblock.appendChild(mode);
    const distance = document.createElement("div");
    distance.classList.add("distance");
    distance.id = "distance_" + id;
    typeblock.appendChild(distance);
    const phone = document.createElement("div");
    phone.classList.add("phone");
    phone.id = "phone_" + id;
    typeblock.appendChild(phone);
    const url = document.createElement("div");
    url.classList.add("url");
    url.id = "url_" + id;
    typeblock.appendChild(url);
    channelblock.appendChild(typeblock);
    entry.appendChild(channelblock);

    const name = document.createElement("div");
    name.classList.add("name");
    name.id = "name_" + id;
    entry.appendChild(name);

    const callname = document.createElement("div");
    callname.classList.add("name");
    callname.id = "callname_" + id;
    entry.appendChild(callname);

    const notes = document.createElement("div");
    notes.classList.add("notes");
    notes.id = "notes_" + id;
    entry.appendChild(notes);

    const generic_note = document.createElement("div");
    generic_note.classList.add("note");
    generic_note.id = "generic_note_" + id;
    notes.appendChild(generic_note);

    const pleasure_note = document.createElement("div");
    pleasure_note.classList.add("note");
    pleasure_note.id = "pleasure_note_" + id;
    notes.appendChild(pleasure_note);

    const cargo_note = document.createElement("div");
    cargo_note.classList.add("note");
    cargo_note.id = "cargo_note_" + id;
    notes.appendChild(cargo_note);

    document.getElementById("list").appendChild(entry);
  }

  readOptions();
  setInterval(function () {
    fetchNearby(true);
  }, 5000);
</script>
