name: Sync VHF features from database

# Backup copy of public.vhf_features → data/{CC}.json.
# On-save pushes will come from htool/VHFinfoSite once that repo's
# "Push VHF data to vhfinfo" Action is configured. Keep this schedule
# until that Action is writing, then this file can be removed.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-vhf-from-db
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Write country GeoJSON from public.vhf_features
        run: node scripts/sync-vhf-to-git.js
      - name: Commit if the git copy changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          if git diff --cached --quiet; then
            echo "No GeoJSON changes"
            exit 0
          fi
          git commit -m "Sync VHF features from database"
          git push
