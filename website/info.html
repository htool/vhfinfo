<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Nearby maritime VHF channels as a cockpit-style list. Uses your GPS, no map."
    />
    <title>Nearby VHF channels — VHFinfo.org</title>
    <link rel="stylesheet" href="site.css" />
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <script src="cronstrue.min.js"></script>
    <script src="supabase-config.js"></script>
    <script src="features-db.js"></script>
    <script src="feature-info.js"></script>
  </head>
  <body class="page-info">
    <a class="skip-link" href="#list">Skip to channels</a>
    <header class="site-header">
      <a class="site-brand" href="./index.html">VHFinfo</a>
      <button
        class="nav-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="site-nav"
      >
        Menu
      </button>
      <nav id="site-nav" class="site-nav" aria-label="Primary">
        <a href="./index.html">Home</a>
        <a href="./map.html">Map</a>
        <a href="./info.html" aria-current="page">Nearby</a>
        <a href="./index.html#contact">Contact</a>
        <a href="./index.html#donate">Donate</a>
      </nav>
    </header>

    <div class="info-toolbar">
      <div class="wrap">
        <p class="info-status" id="status" role="status">Locating…</p>
        <div class="info-actions">
          <button class="btn btn-gold is-on" type="button" id="btn-gps">
            Use GPS
          </button>
          <button class="btn btn-dark" type="button" id="btn-compass">
            Look ahead
          </button>
          <button class="btn btn-dark" type="button" id="btn-amsterdam">
            Demo: Amsterdam
          </button>
          <button class="btn btn-dark" type="button" id="btn-ijsselmeer">
            Demo: IJsselmeer
          </button>
        </div>
        <div
          class="info-actions info-layers"
          id="layer-toggles"
          role="group"
          aria-label="Layer types"
        >
          <button
            class="btn btn-gold is-on"
            type="button"
            id="btn-layer-vts"
            data-layer="vts"
            aria-pressed="true"
          >
            VTS
          </button>
          <button
            class="btn btn-gold is-on"
            type="button"
            id="btn-layer-radar"
            data-layer="radar"
            aria-pressed="true"
          >
            VTS Radar
          </button>
          <button
            class="btn btn-gold is-on"
            type="button"
            id="btn-layer-lock"
            data-layer="lock"
            aria-pressed="true"
          >
            Locks
          </button>
          <button
            class="btn btn-gold is-on"
            type="button"
            id="btn-layer-bridge"
            data-layer="bridge"
            aria-pressed="true"
          >
            Bridges
          </button>
          <button
            class="btn btn-gold is-on"
            type="button"
            id="btn-layer-marina"
            data-layer="marina"
            aria-pressed="true"
          >
            Marinas
          </button>
          <button
            class="btn btn-gold is-on"
            type="button"
            id="btn-layer-area"
            data-layer="area"
            aria-pressed="true"
          >
            Areas
          </button>
        </div>
      </div>
    </div>

    <main>
      <div id="list" aria-live="polite"></div>
    </main>

    <script src="site.js"></script>
    <script src="info.js"></script>
  </body>
</html>
