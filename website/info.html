<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="0;url=nearby.html" />
    <title>Redirecting to Nearby…</title>
    <script>
      (function () {
        var target = "nearby.html" + location.search + location.hash;
        location.replace(target);
      })();
    </script>
  </head>
  <body>
    <p>
      This page moved to
      <a id="nearby-redirect" href="nearby.html">nearby.html</a>.
    </p>
    <script>
      document.getElementById("nearby-redirect").href =
        "nearby.html" + location.search + location.hash;
    </script>
  </body>
</html>
